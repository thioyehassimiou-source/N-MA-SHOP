name: 📱 Build N'MaShop — Mobile Admin APK

on:
  # Déclenchement manuel depuis l'onglet Actions de GitHub
  workflow_dispatch:
    inputs:
      version:
        description: "Version de l'application mobile (ex: 1.0.0)"
        required: false
        default: "1.0.0"

  # Déclenchement automatique à chaque push sur la branche main
  push:
    branches:
      - main
    paths:
      - "apps/admin_mobile/**"
      - ".github/workflows/build-mobile.yml"

jobs:
  build-apk:
    name: 🤖 Compiler l'APK Android Release
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/admin_mobile

    steps:
      # ── 1. Récupérer le code source ──────────────────────────────────────
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      # ── 2. Configurer Java 17 ─────────────────────────────────────────────
      - name: ☕ Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # ── 3. Installer Flutter ──────────────────────────────────────────────
      - name: 🐦 Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      # ── 4. Nettoyer et installer les dépendances ──────────────────────────
      - name: 📦 Installer dépendances (pub get)
        run: |
          flutter clean
          flutter pub get

      # ── 5. Générer le fichier .env et exécuter build_runner ─────────────
      - name: 🔑 Générer .env et code obfusqué
        shell: bash
        run: |
          echo 'NEON_CONNECTION_STRING="postgresql://neondb_owner:npg_bY9MjSynWF4N@ep-long-scene-aeya27z7-pooler.c-2.us-east-2.aws.neon.tech/neondb?sslmode=require"' > .env
          echo 'LICENSE_SECURITY_SALT="NMaShop_security_salt_2026"' >> .env
          echo 'LICENSE_SECRET_F1="Nm4"' >> .env
          echo 'LICENSE_SECRET_F2="Sh0"' >> .env
          echo 'LICENSE_SECRET_F3="pGN"' >> .env
          echo 'LICENSE_SECRET_F4="3e!"' >> .env
          echo 'LICENSE_SECRET_F5="2026"' >> .env
          dart run build_runner build --delete-conflicting-outputs

      # ── 6. Exécuter les tests unitaires ───────────────────────────────────
      - name: 🧪 Tests unitaires
        run: flutter test

      # ── 7. Compiler l'APK Release ─────────────────────────────────────────
      - name: 🔨 Compiler l'APK Android (Release)
        run: flutter build apk --release

      # ── 8. Renommer et Uploader l'APK ─────────────────────────────────────
      - name: 🏷️ Préparer l'APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/NMaShop_Admin_Mobile_v${{ github.event.inputs.version || '1.0.0' }}.apk

      - name: ⬆️ Publier l'APK Android (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: NMaShop-Admin-Mobile-v${{ github.event.inputs.version || '1.0.0' }}
          path: apps/admin_mobile/build/app/outputs/flutter-apk/NMaShop_Admin_Mobile_v*.apk
          retention-days: 30
