name: 🚀 Build N'MaShop — Windows Installer

on:
  # Déclenchement manuel depuis l'onglet "Actions" de GitHub
  workflow_dispatch:
    inputs:
      version:
        description: "Version de l'application (ex: 1.0.0)"
        required: false
        default: "1.0.0"
  # Déclenchement automatique sur push main
  push:
    branches:
      - main
    paths:
      - "lib/**"
      - "windows/**"
      - "pubspec.yaml"
      - ".github/workflows/build-windows.yml"

jobs:
  build-windows:
    name: 🪟 Compiler pour Windows (Release & Installeur)
    runs-on: windows-latest

    steps:
      # ── 1. Récupérer le code source ──────────────────────────────────────
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      # ── 2. Installer Flutter ──────────────────────────────────────────────
      - name: 🐦 Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      # ── 3. Vérifier l'environnement ───────────────────────────────────────
      - name: 🔍 Vérifier Flutter
        run: flutter doctor -v

      # ── 4. Nettoyer et installer les dépendances ──────────────────────────
      - name: 📦 Dépendances Flutter (pub get)
        run: |
          flutter clean
          flutter pub get

      # ── 5. Générer le fichier .env et exécuter build_runner ─────────────
      - name: 🔑 Générer .env et code obfusqué
        shell: bash
        run: |
          NEON="${{ secrets.NEON_CONNECTION_STRING }}"
          if [ -z "$NEON" ]; then
            NEON="postgresql://neondb_owner:npg_bY9MjSynWF4N@ep-long-scene-aeya27z7-pooler.c-2.us-east-2.aws.neon.tech/neondb?sslmode=require"
          fi
          echo "NEON_CONNECTION_STRING=\"$NEON\"" > .env

          SALT="${{ secrets.LICENSE_SECURITY_SALT }}"
          if [ -z "$SALT" ]; then
            SALT="NMaShop_security_salt_2026"
          fi
          echo "LICENSE_SECURITY_SALT=\"$SALT\"" >> .env

          F1="${{ secrets.LICENSE_SECRET_F1 }}"
          echo "LICENSE_SECRET_F1=\"${F1:-Nm4}\"" >> .env

          F2="${{ secrets.LICENSE_SECRET_F2 }}"
          echo "LICENSE_SECRET_F2=\"${F2:-Sh0}\"" >> .env

          F3="${{ secrets.LICENSE_SECRET_F3 }}"
          echo "LICENSE_SECRET_F3=\"${F3:-pGN}\"" >> .env

          F4="${{ secrets.LICENSE_SECRET_F4 }}"
          echo "LICENSE_SECRET_F4=\"${F4:-3e!}\"" >> .env

          F5="${{ secrets.LICENSE_SECRET_F5 }}"
          echo "LICENSE_SECRET_F5=\"${F5:-2026}\"" >> .env

          dart run build_runner build --delete-conflicting-outputs

      # ── 6. Exécuter les tests unitaires et d'intégration ────────────────
      - name: 🧪 Exécuter les tests Desktop
        run: flutter test test/

      # ── 7. Compiler l'application pour Windows ────────────────────────────
      - name: 🔨 Compiler N'MaShop (Windows Release Obfusqué)
        run: flutter build windows --release --obfuscate --split-debug-info=build/symbols --build-name=${{ inputs.version || '1.0.0' }}

      # ── 8. Garantir la présence de sqlite3.dll dans le bundle Release ───
      - name: 🧩 Copier sqlite3.dll dans le bundle Release
        run: |
          if (Test-Path "windows\sqlite3.dll") {
            Copy-Item -Path "windows\sqlite3.dll" -Destination "build\windows\x64\runner\Release\sqlite3.dll" -Force
          }
        shell: powershell

      # ── 9. Créer l'archive Portable ZIP propre ────────────────────────────
      - name: 📦 Créer l'archive Portable (ZIP)
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "build\windows\NMaShop_Windows_Portable_v${{ inputs.version || '1.0.0' }}.zip" -Force
        shell: powershell

      # ── 10. Télécharger Visual C++ Redistributable pour l'installeur ────
      - name: 📥 Télécharger VC++ Redistributable
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "windows\vc_redist.x64.exe"
        shell: powershell

      # ── 11. Compiler l'installeur avec Inno Setup ─────────────────────────
      # Inno Setup 6 est pré-installé sur les runners Windows GitHub Actions
      - name: 📦 Créer l'installeur avec Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "windows\setup.iss"
          Compress-Archive -Path "build\windows\NMaShop_Setup_v1.0.0.exe" -DestinationPath "build\windows\NMaShop_Installer.zip" -Force
        shell: pwsh

      # ── 12. Uploader les artefacts ────────────────────────────────────────
      - name: ⬆️ Publier l'installeur d'installation (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: NMaShop-Windows-Setup-v${{ inputs.version || '1.0.0' }}
          path: build/windows/NMaShop_Setup_*.exe
          retention-days: 30

      - name: ⬆️ Publier l'installeur dans un ZIP propre (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: NMaShop-Windows-Installer-ZIP-v${{ inputs.version || '1.0.0' }}
          path: build/windows/NMaShop_Installer.zip
          retention-days: 30

      - name: ⬆️ Publier l'archive portable (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: NMaShop-Windows-Portable-v${{ inputs.version || '1.0.0' }}
          path: build/windows/NMaShop_Windows_Portable_v*.zip
          retention-days: 30
