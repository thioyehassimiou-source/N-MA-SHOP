name: 🚀 Build N'MaShop — Windows Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version de l'application (ex: 1.1.9)"
        required: false
        default: "1.1.9"
  push:
    branches:
      - main
    paths:
      - "lib/**"
      - "windows/**"
      - "pubspec.yaml"
      - ".github/workflows/build-windows.yml"

jobs:
  build-windows:
    name: 🪟 Compiler pour Windows (Release & Installeur)
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 📌 Déterminer la version
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          fi
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="1.1.9"
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: 🐦 Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: 🔍 Vérifier Flutter
        run: flutter doctor -v

      - name: 📦 Dépendances Flutter (pub get)
        run: |
          flutter clean
          flutter pub get

      - name: 🔑 Générer .env et code obfusqué
        shell: bash
        run: |
          cat << 'EOF' > .env
          NEON_CONNECTION_STRING=postgresql://neondb_owner:npg_bY9MjSynWF4N@ep-long-scene-aeya27z7-pooler.c-2.us-east-2.aws.neon.tech/neondb?sslmode=require
          LICENSE_SECURITY_SALT=NMaShop_security_salt_2026
          LICENSE_SECRET_F1=Nm4
          LICENSE_SECRET_F2=Sh0
          LICENSE_SECRET_F3=pGN
          LICENSE_SECRET_F4=3e!
          LICENSE_SECRET_F5=2026
          EOF
          NEON="${{ secrets.NEON_CONNECTION_STRING }}"
          if [ -n "$NEON" ]; then
            echo "NEON_CONNECTION_STRING=$NEON" > .env
          fi
          SALT="${{ secrets.LICENSE_SECURITY_SALT }}"
          if [ -n "$SALT" ]; then
            echo "LICENSE_SECURITY_SALT=$SALT" >> .env
          fi
          dart run build_runner build --delete-conflicting-outputs

      - name: 🧪 Exécuter les tests Desktop
        run: flutter test test/

      - name: 🔨 Compiler N'MaShop (Windows Release Obfusqué)
        run: flutter build windows --release --obfuscate --split-debug-info=build/symbols --build-name=${{ env.APP_VERSION }}

      - name: 🧩 Copier sqlite3.dll dans le bundle Release
        run: |
          if (Test-Path "windows\sqlite3.dll") {
            Copy-Item -Path "windows\sqlite3.dll" -Destination "build\windows\x64\runner\Release\sqlite3.dll" -Force
          }
        shell: powershell

      - name: 📦 Créer l'archive Portable (ZIP)
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "build\windows\NMaShop_Windows_Portable_v${{ env.APP_VERSION }}.zip" -Force
        shell: powershell

      - name: 📥 Télécharger VC++ Redistributable
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "windows\vc_redist.x64.exe"
        shell: powershell

      - name: 📦 Créer l'installeur avec Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:APP_VERSION" "windows\setup.iss"
          Compress-Archive -Path "build\windows\NMaShop_Setup_*.exe" -DestinationPath "build\windows\NMaShop_Installer.zip" -Force
        shell: pwsh

      - name: ⬆️ Publier l'installeur d'installation (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: NMaShop-Windows-Setup-v${{ env.APP_VERSION }}
          path: build/windows/NMaShop_Setup_*.exe
          retention-days: 30

      - name: ⬆️ Publier l'installeur dans un ZIP propre (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: NMaShop-Windows-Installer-ZIP-v${{ env.APP_VERSION }}
          path: build/windows/NMaShop_Installer.zip
          retention-days: 30

      - name: ⬆️ Publier l'archive portable (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: NMaShop-Windows-Portable-v${{ env.APP_VERSION }}
          path: build/windows/NMaShop_Windows_Portable_v*.zip
          retention-days: 30
