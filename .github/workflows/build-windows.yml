name: 🚀 Build N'MaShop — Windows Installer

on:
  # Déclenchement manuel depuis l'onglet "Actions" de GitHub
  workflow_dispatch:
    inputs:
      version:
        description: "Version de l'application (ex: 1.0.1)"
        required: false
        default: "1.0.0"
  # Déclenchement automatique à chaque push sur la branche main
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"

jobs:
  build-windows:
    name: 🪟 Compiler pour Windows
    runs-on: windows-latest

    steps:
      # ── 1. Récupérer le code source ──────────────────────────────────────
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      # ── 2. Installer Flutter ──────────────────────────────────────────────
      - name: 🐦 Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      # ── 3. Vérifier l'environnement ───────────────────────────────────────
      - name: 🔍 Vérifier Flutter
        run: flutter doctor -v

      # ── 4. Nettoyer et installer les dépendances ──────────────────────────
      - name: 📦 Nettoyage et dépendances (flutter pub get)
        run: |
          flutter clean
          flutter pub get

      # ── 4.5. Générer le fichier .env et exécuter build_runner ─────────────
      - name: 🔑 Générer .env et code obfusqué
        shell: bash
        run: |
          echo 'NEON_CONNECTION_STRING="postgresql://neondb_owner:npg_bY9MjSynWF4N@ep-long-scene-aeya27z7-pooler.c-2.us-east-2.aws.neon.tech/neondb?sslmode=require"' > .env
          echo 'LICENSE_SECURITY_SALT="NMaShop_security_salt_2026"' >> .env
          echo 'LICENSE_SECRET_F1="Nm4"' >> .env
          echo 'LICENSE_SECRET_F2="Sh0"' >> .env
          echo 'LICENSE_SECRET_F3="pGN"' >> .env
          echo 'LICENSE_SECRET_F4="3e!"' >> .env
          echo 'LICENSE_SECRET_F5="2026"' >> .env
          dart run build_runner build --delete-conflicting-outputs

      # ── 5. Compiler l'application pour Windows ────────────────────────────
      - name: 🔨 Compiler N'MaShop (Windows Release)
        run: flutter build windows --release --build-name=${{ inputs.version || '1.0.0' }}

      # ── 6. Créer l'archive Portable ZIP propre ────────────────────────────
      - name: 📦 Créer l'archive Portable (ZIP)
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "build\windows\NMaShop_Windows_Portable_v${{ github.event.inputs.version || '1.0.0' }}.zip" -Force
        shell: powershell

      # ── 6.5 Télécharger Visual C++ Redistributable pour l'installeur ─────
      - name: 📥 Télécharger VC++ Redistributable
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "windows\vc_redist.x64.exe"
        shell: powershell

      # ── 7. Compiler l'installeur avec Inno Setup ──────────────────────────
      # Inno Setup est pré-installé sur les runners GitHub Windows
      - name: 📦 Créer l'installeur avec Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "windows\setup.iss"
        shell: pwsh

      # ── 8. Uploader les artefacts ─────────────────────────────────────────
      - name: ⬆️ Publier l'installeur d'installation (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: NMaShop-Windows-Setup-v${{ github.event.inputs.version || '1.0.0' }}
          path: build\windows\NMaShop_Setup_v1.0.0.exe
          retention-days: 30

      - name: ⬆️ Publier l'archive portable (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: NMaShop-Windows-Portable-v${{ github.event.inputs.version || '1.0.0' }}
          path: build\windows\NMaShop_Windows_Portable_v${{ github.event.inputs.version || '1.0.0' }}.zip
          retention-days: 30
