name: 📱 Build Admin Mobile (APK Android Indépendant)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version de l'APK (ex: 1.2.2)"
        required: true
        default: "1.2.2"

jobs:
  build-apk:
    name: 📱 Compiler l'APK Android Admin Mobile
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 📌 Déterminer la version
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="1.2.2"
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: ☕ Configurer Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🐦 Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: 📦 Dépendances Admin Mobile
        run: |
          cd apps/admin_mobile
          flutter clean
          flutter pub get

      - name: 🤖 Accepter les licences Android
        run: yes | flutter doctor --android-licenses || true

      - name: 🔨 Compiler APK Release
        run: |
          cd apps/admin_mobile
          chmod +x android/gradlew
          flutter build apk --release --build-name=${{ env.APP_VERSION }}

      - name: 📦 Préparer le fichier APK
        run: |
          APK_FILE=$(find apps/admin_mobile/build/app/outputs/flutter-apk/ -name "*release.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -name "*release.apk" -not -path "*/intermediates/*" | head -n 1)
          fi
          echo "APK trouvé : $APK_FILE"
          cp "$APK_FILE" NMaShop_Admin_Mobile_v${{ env.APP_VERSION }}.apk

      - name: ⬆️ Télécharger l'APK compilé (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: NMaShop_Admin_Mobile_v${{ env.APP_VERSION }}.apk
          path: NMaShop_Admin_Mobile_v*.apk
          retention-days: 30

      - name: 🚀 Attacher l'APK à la Release GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.version != ''
        with:
          tag_name: v${{ env.APP_VERSION }}
          files: NMaShop_Admin_Mobile_v*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
