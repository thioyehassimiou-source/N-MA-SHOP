name: 🛍️ Build Customer Mobile (APK Android Commerçant)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version de l'APK (ex: 1.2.0)"
        required: true
        default: "1.2.0"

jobs:
  build-apk:
    name: 🛍️ Compiler l'APK Android Customer Mobile
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 📌 Déterminer la version
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="1.2.0"
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: ☕ Configurer Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🐦 Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: 📦 Dépendances Customer Mobile
        run: |
          cd apps/customer_mobile
          flutter clean
          flutter pub get

      - name: 🤖 Accepter les licences Android
        run: yes | flutter doctor --android-licenses || true

      - name: 🔨 Compiler APK Release
        run: |
          cd apps/customer_mobile
          chmod +x android/gradlew
          export LINT_PRINT_STACKTRACE=true
          flutter build apk --release --build-name=${{ env.APP_VERSION }} --android-skip-build-dependency-validation

      - name: 🌐 Compiler Web Mobile
        run: |
          cd apps/customer_mobile
          flutter build web --release --base-href /
          cd build/web
          tar -czf ../../../NMaShop_Customer_Mobile_Web.tar.gz .

      - name: 📦 Préparer le fichier APK
        run: |
          APK_FILE=$(find apps/customer_mobile/build/app/outputs/flutter-apk/ -name "*release.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find apps/customer_mobile/build/app/outputs/ -name "*release.apk" 2>/dev/null | head -n 1)
          fi
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -name "*release.apk" -not -path "*/intermediates/*" | head -n 1)
          fi
          echo "APK trouvé : $APK_FILE"
          cp "$APK_FILE" NMaShop_Mobile_v${{ env.APP_VERSION }}.apk

      - name: ⬆️ Télécharger l'APK compilé (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: NMaShop_Mobile_v${{ env.APP_VERSION }}.apk
          path: NMaShop_Mobile_v*.apk
          retention-days: 30

      - name: ⬆️ Télécharger Web Mobile (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: NMaShop_Customer_Mobile_Web
          path: NMaShop_Customer_Mobile_Web.tar.gz
          retention-days: 30

      - name: 🚀 Attacher à la Release GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.version != ''
        with:
          tag_name: v${{ env.APP_VERSION }}
          files: |
            NMaShop_Mobile_v*.apk
            NMaShop_Customer_Mobile_Web.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

