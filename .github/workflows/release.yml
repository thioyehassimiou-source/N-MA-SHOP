name: 🚀 Build & Release N'MaShop v1 (Windows & Linux)

on:
  # Déclenchement manuel depuis l'onglet Actions de GitHub
  workflow_dispatch:
    inputs:
      version:
        description: "Version de publication (ex: 1.0.0)"
        required: false
        default: "1.0.0"

  # Déclenchement automatique lors du push d'un tag de version (ex: v1.0.0)
  push:
    tags:
      - 'v*'

jobs:
  # ── 1. COMPILATION LINUX ───────────────────────────────────────────────────
  build-linux:
    name: 🐧 Build Linux Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout du code source
        uses: actions/checkout@v4

      - name: 🛠️ Installer les dépendances Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev

      - name: 🐦 Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Récupérer les dépendances Flutter
        run: |
          flutter clean
          flutter pub get

      - name: 🔑 Générer .env et code obfusqué
        shell: bash
        run: |
          echo 'NEON_CONNECTION_STRING="postgresql://neondb_owner:npg_bY9MjSynWF4N@ep-long-scene-aeya27z7-pooler.c-2.us-east-2.aws.neon.tech/neondb?sslmode=require"' > .env
          echo 'LICENSE_SECURITY_SALT="NMaShop_security_salt_2026"' >> .env
          echo 'LICENSE_SECRET_F1="Nm4"' >> .env
          echo 'LICENSE_SECRET_F2="Sh0"' >> .env
          echo 'LICENSE_SECRET_F3="pGN"' >> .env
          echo 'LICENSE_SECRET_F4="3e!"' >> .env
          echo 'LICENSE_SECRET_F5="2026"' >> .env
          dart run build_runner build --delete-conflicting-outputs

      - name: 🧪 Exécuter les tests unitaires
        run: flutter test

      - name: 🔨 Compiler l'application (Linux Release)
        run: flutter build linux --release

      - name: 📦 Archive Tarball (.tar.gz)
        run: |
          tar -czvf NMaShop_Linux_v${{ github.event.inputs.version || '1.0.0' }}_x64.tar.gz -C build/linux/x64/release/bundle .

      - name: ⬆️ Sauvegarder l'artefact Linux
        uses: actions/upload-artifact@v4
        with:
          name: NMaShop-Linux-x64-v${{ github.event.inputs.version || '1.0.0' }}
          path: NMaShop_Linux_v*.tar.gz
          retention-days: 30

  # ── 2. COMPILATION WINDOWS ─────────────────────────────────────────────────
  build-windows:
    name: 🪟 Build Windows Release & Installeur
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout du code source
        uses: actions/checkout@v4

      - name: 🐦 Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Récupérer les dépendances Flutter
        run: |
          flutter clean
          flutter pub get

      - name: 🔑 Générer .env et code obfusqué
        shell: bash
        run: |
          echo 'NEON_CONNECTION_STRING="postgresql://neondb_owner:npg_bY9MjSynWF4N@ep-long-scene-aeya27z7-pooler.c-2.us-east-2.aws.neon.tech/neondb?sslmode=require"' > .env
          echo 'LICENSE_SECURITY_SALT="NMaShop_security_salt_2026"' >> .env
          echo 'LICENSE_SECRET_F1="Nm4"' >> .env
          echo 'LICENSE_SECRET_F2="Sh0"' >> .env
          echo 'LICENSE_SECRET_F3="pGN"' >> .env
          echo 'LICENSE_SECRET_F4="3e!"' >> .env
          echo 'LICENSE_SECRET_F5="2026"' >> .env
          dart run build_runner build --delete-conflicting-outputs

      - name: 🧪 Exécuter les tests unitaires
        run: flutter test

      - name: 🔨 Compiler l'application (Windows Release)
        run: flutter build windows --release

      - name: 🧩 Copier sqlite3.dll dans le bundle Release
        run: |
          if (Test-Path "windows\sqlite3.dll") {
            Copy-Item -Path "windows\sqlite3.dll" -Destination "build\windows\x64\runner\Release\sqlite3.dll" -Force
          }
        shell: powershell

      - name: 📦 Créer l'archive Portable (ZIP)
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "build\windows\NMaShop_Windows_Portable_v${{ github.event.inputs.version || '1.0.0' }}.zip" -Force
        shell: powershell

      - name: 📥 Télécharger VC++ Redistributable pour l'installeur
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "windows\vc_redist.x64.exe"
        shell: powershell

      - name: ⚙️ Générer l'installeur (.exe) avec Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "windows\setup.iss"
        shell: pwsh

      - name: ⬆️ Sauvegarder l'installeur Windows (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: NMaShop-Windows-Setup-v${{ github.event.inputs.version || '1.0.0' }}
          path: build/windows/NMaShop_Setup_v1.0.0.exe
          retention-days: 30

      - name: ⬆️ Sauvegarder l'archive Portable (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: NMaShop-Windows-Portable-v${{ github.event.inputs.version || '1.0.0' }}
          path: build/windows/NMaShop_Windows_Portable_v${{ github.event.inputs.version || '1.0.0' }}.zip
          retention-days: 30

  # ── 3. COMPILATION MOBILE ANDROID APK ───────────────────────────────────────
  build-mobile:
    name: 📱 Build Android Admin APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin_mobile

    steps:
      - name: 📥 Checkout du code source
        uses: actions/checkout@v4

      - name: ☕ Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🐦 Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Installer dépendances
        run: |
          flutter clean
          flutter pub get

      - name: 🔑 Générer .env et code obfusqué
        shell: bash
        run: |
          echo 'NEON_CONNECTION_STRING="postgresql://neondb_owner:npg_bY9MjSynWF4N@ep-long-scene-aeya27z7-pooler.c-2.us-east-2.aws.neon.tech/neondb?sslmode=require"' > .env
          echo 'LICENSE_SECURITY_SALT="NMaShop_security_salt_2026"' >> .env
          echo 'LICENSE_SECRET_F1="Nm4"' >> .env
          echo 'LICENSE_SECRET_F2="Sh0"' >> .env
          echo 'LICENSE_SECRET_F3="pGN"' >> .env
          echo 'LICENSE_SECRET_F4="3e!"' >> .env
          echo 'LICENSE_SECRET_F5="2026"' >> .env
          dart run build_runner build --delete-conflicting-outputs

      - name: 🔨 Compiler l'APK Android (Release)
        run: flutter build apk --release

      - name: 🏷️ Préparer l'APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/NMaShop_Admin_Mobile_v${{ github.event.inputs.version || '1.0.0' }}.apk

      - name: ⬆️ Sauvegarder l'artefact Mobile
        uses: actions/upload-artifact@v4
        with:
          name: NMaShop-Admin-Mobile-v${{ github.event.inputs.version || '1.0.0' }}
          path: apps/admin_mobile/build/app/outputs/flutter-apk/NMaShop_Admin_Mobile_v*.apk
          retention-days: 30

  # ── 4. PUBLICATION AUTOMATIQUE DE LA RELEASE GITHUB ────────────────────────
  publish-release:
    name: 🏷️ Publier la Release Officielle GitHub
    needs: [build-linux, build-windows, build-mobile]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Télécharger l'artefact Linux
        uses: actions/download-artifact@v4
        with:
          name: NMaShop-Linux-x64-v${{ github.event.inputs.version || '1.0.0' }}
          path: ./release-files

      - name: 📥 Télécharger l'installeur Windows (.exe)
        uses: actions/download-artifact@v4
        with:
          name: NMaShop-Windows-Setup-v${{ github.event.inputs.version || '1.0.0' }}
          path: ./release-files

      - name: 📥 Télécharger la version portable Windows (.zip)
        uses: actions/download-artifact@v4
        with:
          name: NMaShop-Windows-Portable-v${{ github.event.inputs.version || '1.0.0' }}
          path: ./release-files

      - name: 📥 Télécharger l'APK Mobile Admin Android (.apk)
        uses: actions/download-artifact@v4
        with:
          name: NMaShop-Admin-Mobile-v${{ github.event.inputs.version || '1.0.0' }}
          path: ./release-files

      - name: 🚀 Créer la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || format('v{0}', github.event.inputs.version || '1.0.0') }}
          name: N'MaShop v${{ github.event.inputs.version || '1.0.0' }} (Desktop PC & Mobile Admin)
          body: |
            🎉 **N'MaShop v1.0.0 — Publication Officielle de Production**
            
            ### 📦 Fichiers d'installation inclus :
            * 🪟 **Windows PC** : Installeur sécurisé (`NMaShop_Setup_v1.0.0.exe`) et version portable (`ZIP`).
            * 📱 **Mobile Admin Android** : Application mobile d'administration (`NMaShop_Admin_Mobile_v1.0.0.apk`) pour émettre et gérer vos licences sur smartphone.
            * 🐧 **Linux** : Archive binaire natif (`NMaShop_Linux_v1.0.0_x64.tar.gz`).
            
            ### ✨ Fonctionnalités clés :
            * Gestion commerciale complète (Caisse, Ventes, Stocks, Dépenses, Créances).
            * Chiffrement HMAC-SHA256 avec liaison matérielle PC (Device Binding).
            * Génération de licences et envoi WhatsApp 1-clic depuis le mobile.
            * Synchronisation Cloud bidirectionnelle Neon PostgreSQL.
          files: |
            ./release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
