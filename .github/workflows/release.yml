name: 🚀 N'MaShop — Publication Release Officielle (Windows & Linux)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version de la release (ex: 1.3.0)"
        required: true
        default: "1.3.0"
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: 🪟 Build Windows (Installeur .exe & Portable .zip)
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 📌 Déterminer la version
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          fi
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="1.3.0"
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: 🐦 Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: 📦 Dépendances Flutter
        run: |
          flutter clean
          flutter pub get

      - name: 🔑 Générer .env et code obfusqué
        shell: bash
        run: |
          cat << 'EOF' > .env
          NEON_CONNECTION_STRING=postgresql://neondb_owner:npg_bY9MjSynWF4N@ep-long-scene-aeya27z7-pooler.c-2.us-east-2.aws.neon.tech/neondb?sslmode=require
          LICENSE_SECURITY_SALT=NMaShop_security_salt_2026
          LICENSE_SECRET_F1=Nm4
          LICENSE_SECRET_F2=Sh0
          LICENSE_SECRET_F3=pGN
          LICENSE_SECRET_F4=3e!
          LICENSE_SECRET_F5=2026
          EOF
          NEON="${{ secrets.NEON_CONNECTION_STRING }}"
          if [ -n "$NEON" ]; then
            echo "NEON_CONNECTION_STRING=$NEON" > .env
          fi
          SALT="${{ secrets.LICENSE_SECURITY_SALT }}"
          if [ -n "$SALT" ]; then
            echo "LICENSE_SECURITY_SALT=$SALT" >> .env
          fi
          dart run build_runner build --delete-conflicting-outputs

      - name: 🧪 Exécuter les tests Desktop
        run: flutter test test/

      - name: 🔨 Compiler l'application (Windows Release Obfusqué)
        run: flutter build windows --release --obfuscate --split-debug-info=build/symbols --build-name=${{ env.APP_VERSION }}

      - name: 🧩 Copier sqlite3.dll dans le bundle Release
        run: |
          if (Test-Path "windows\sqlite3.dll") {
            Copy-Item -Path "windows\sqlite3.dll" -Destination "build\windows\x64\runner\Release\sqlite3.dll" -Force
          }
        shell: powershell

      - name: 📦 Créer l'archive Portable (ZIP)
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "build\windows\NMaShop_Windows_Portable_v${{ env.APP_VERSION }}.zip" -Force
        shell: powershell

      - name: 📥 Télécharger VC++ Redistributable pour l'installeur
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "windows\vc_redist.x64.exe"
        shell: powershell

      - name: ⚙️ Compiler l'installeur avec Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:APP_VERSION" "windows\setup.iss"
        shell: pwsh

      - name: 📦 Compresser l'installeur dans un ZIP d'installation
        run: |
          Compress-Archive -Path "build\windows\NMaShop_Setup_*.exe" -DestinationPath "build\windows\NMaShop_Installer.zip" -Force
        shell: pwsh

      - name: ⬆️ Upload Installeur Windows (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: NMaShop-Windows-Setup-v${{ env.APP_VERSION }}
          path: build/windows/NMaShop_Setup_*.exe
          retention-days: 30

      - name: ⬆️ Upload Installeur ZIP (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: NMaShop-Windows-Installer-ZIP-v${{ env.APP_VERSION }}
          path: build/windows/NMaShop_Installer.zip
          retention-days: 30

      - name: ⬆️ Upload Version Portable (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: NMaShop-Windows-Portable-v${{ env.APP_VERSION }}
          path: build/windows/NMaShop_Windows_Portable_v*.zip
          retention-days: 30

  build-linux:
    name: 🐧 Build Linux (x64 Release .tar.gz)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 📌 Déterminer la version
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          fi
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="1.3.0"
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: 🛠️ Installer les dépendances Linux système
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev

      - name: 🐦 Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: 📦 Dépendances Flutter
        run: |
          flutter clean
          flutter pub get

      - name: 🔑 Générer .env et code obfusqué
        shell: bash
        run: |
          cat << 'EOF' > .env
          NEON_CONNECTION_STRING=postgresql://neondb_owner:npg_bY9MjSynWF4N@ep-long-scene-aeya27z7-pooler.c-2.us-east-2.aws.neon.tech/neondb?sslmode=require
          LICENSE_SECURITY_SALT=NMaShop_security_salt_2026
          LICENSE_SECRET_F1=Nm4
          LICENSE_SECRET_F2=Sh0
          LICENSE_SECRET_F3=pGN
          LICENSE_SECRET_F4=3e!
          LICENSE_SECRET_F5=2026
          EOF
          NEON="${{ secrets.NEON_CONNECTION_STRING }}"
          if [ -n "$NEON" ]; then
            echo "NEON_CONNECTION_STRING=$NEON" > .env
          fi
          SALT="${{ secrets.LICENSE_SECURITY_SALT }}"
          if [ -n "$SALT" ]; then
            echo "LICENSE_SECURITY_SALT=$SALT" >> .env
          fi
          dart run build_runner build --delete-conflicting-outputs

      - name: 🧪 Exécuter les tests Desktop
        run: flutter test test/

      - name: 🔨 Compiler l'application (Linux Release Obfusqué)
        run: |
          mkdir -p build/symbols
          flutter build linux --release --obfuscate --split-debug-info=build/symbols --build-name=${{ env.APP_VERSION }}

      - name: 📦 Créer l'archive Tarball (.tar.gz)
        run: |
          tar -czvf NMaShop_Linux_v${{ env.APP_VERSION }}_x64.tar.gz -C build/linux/x64/release/bundle .

      - name: ⬆️ Upload Archive Linux (.tar.gz)
        uses: actions/upload-artifact@v4
        with:
          name: NMaShop-Linux-x64-v${{ env.APP_VERSION }}
          path: NMaShop_Linux_v*.tar.gz
          retention-days: 30

  build-admin-mobile:
    name: 📱 Build Admin Mobile (Android APK)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 📌 Déterminer la version
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          fi
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="1.3.0"
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: ☕ Configurer Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🐦 Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: 📦 Dépendances Admin Mobile
        run: |
          cd apps/admin_mobile
          flutter clean
          flutter pub get

      - name: 🧪 Tester Admin Mobile
        run: |
          cd apps/admin_mobile
          flutter test test/

      - name: 🔨 Compiler APK Release
        run: |
          cd apps/admin_mobile
          flutter build apk --release --build-name=${{ env.APP_VERSION }}

      - name: 📦 Préparer l'APK pour la distribution
        run: |
          cp apps/admin_mobile/build/app/outputs/flutter-apk/app-release.apk NMaShop_Admin_Mobile_v${{ env.APP_VERSION }}.apk

      - name: ⬆️ Upload APK Admin Mobile
        uses: actions/upload-artifact@v4
        with:
          name: NMaShop-Admin-Mobile-APK-v${{ env.APP_VERSION }}
          path: NMaShop_Admin_Mobile_v*.apk
          retention-days: 30

  publish-release:
    name: 🏷️ Publier la Release GitHub
    needs: [build-windows, build-linux, build-admin-mobile]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Créer le répertoire de distribution
        run: mkdir -p ./release-assets

      - name: 📌 Déterminer la version
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          fi
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="1.3.0"
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: 📥 Télécharger tous les artefacts compilés (Windows, Linux & Android APK)
        uses: actions/download-artifact@v4
        with:
          pattern: NMaShop-*
          path: ./release-assets
          merge-multiple: true

      - name: 🚀 Créer la Release GitHub Officielle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', env.APP_VERSION) }}
          name: N'MaShop v${{ env.APP_VERSION }} (Desktop & Admin Mobile)
          body: |
            🎉 **Publication Officielle de Production — N'MaShop v${{ env.APP_VERSION }}**
            
            Logiciel de gestion commerciale, caisse POS et comptabilité 100% hors-ligne pour commerçants et grossistes.
            
            ### 📦 Fichiers téléchargeables :
            * 🪟 **Windows (Recommandé pour PC)** :
              * **Installeur automatique** : `NMaShop_Setup_v${{ env.APP_VERSION }}.exe` (avec dépendances C++ et création d'icône bureau)
              * **Version portable** : `NMaShop_Windows_Portable_v${{ env.APP_VERSION }}.zip` (décompresser et lancer directement)
            * 🐧 **Linux (Ubuntu / Debian x64)** :
              * **Archive binaire native** : `NMaShop_Linux_v${{ env.APP_VERSION }}_x64.tar.gz`
            * 📱 **Android (Application Administrateur Mobile)** :
              * **APK Installable** : `NMaShop_Admin_Mobile_v${{ env.APP_VERSION }}.apk` (Générateur de clés mobile, suivi des clients et transmission WhatsApp)
            
            ### 🛡️ Sécurité & Spécifications :
            * Code compilé nativement AOT et obfusqué (Levier 1 Sécurité).
            * Chiffrement HMAC-SHA256, liaison matérielle PC (Hardware ID) et période d'essai 7 jours intégrée.
            * Intégrité SQLite Drift v21 (WAL, clés étrangères actives, cache 64 Mo).
            * Support officiel développeur : **+224 624 19 30 69**.
          files: |
            ./release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
