name: 🚀 N'MaShop — Publication Release Officielle (Windows & Linux)

on:
  # Déclenchement manuel avec choix du numéro de version
  workflow_dispatch:
    inputs:
      version:
        description: "Version de la release (ex: 1.0.0)"
        required: true
        default: "1.0.0"

  # Déclenchement automatique lors du push d'un tag (ex: git tag v1.0.0 && git push origin v1.0.0)
  push:
    tags:
      - 'v*'

jobs:
  # ── 1. COMPILATION WINDOWS ─────────────────────────────────────────────────
  build-windows:
    name: 🪟 Build Windows (Installeur .exe & Portable .zip)
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 🐦 Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: 📦 Dépendances Flutter
        run: |
          flutter clean
          flutter pub get

      - name: 🔑 Générer .env et code obfusqué
        shell: bash
        run: |
          echo 'NEON_CONNECTION_STRING="${{ secrets.NEON_CONNECTION_STRING || 'postgresql://neondb_owner:npg_bY9MjSynWF4N@ep-long-scene-aeya27z7-pooler.c-2.us-east-2.aws.neon.tech/neondb?sslmode=require' }}"' > .env
          echo 'LICENSE_SECURITY_SALT="${{ secrets.LICENSE_SECURITY_SALT || 'NMaShop_security_salt_2026' }}"' >> .env
          echo 'LICENSE_SECRET_F1="${{ secrets.LICENSE_SECRET_F1 || 'Nm4' }}"' >> .env
          echo 'LICENSE_SECRET_F2="${{ secrets.LICENSE_SECRET_F2 || 'Sh0' }}"' >> .env
          echo 'LICENSE_SECRET_F3="${{ secrets.LICENSE_SECRET_F3 || 'pGN' }}"' >> .env
          echo 'LICENSE_SECRET_F4="${{ secrets.LICENSE_SECRET_F4 || '3e!' }}"' >> .env
          echo 'LICENSE_SECRET_F5="${{ secrets.LICENSE_SECRET_F5 || '2026' }}"' >> .env
          dart run build_runner build --delete-conflicting-outputs

      - name: 🧪 Exécuter les tests Desktop
        run: flutter test test/

      - name: 🔨 Compiler l'application (Windows Release Obfusqué)
        run: flutter build windows --release --obfuscate --split-debug-info=build/symbols --build-name=${{ inputs.version || '1.0.0' }}

      - name: 🧩 Copier sqlite3.dll dans le bundle Release
        run: |
          if (Test-Path "windows\sqlite3.dll") {
            Copy-Item -Path "windows\sqlite3.dll" -Destination "build\windows\x64\runner\Release\sqlite3.dll" -Force
          }
        shell: powershell

      - name: 📦 Créer l'archive Portable (ZIP)
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "build\windows\NMaShop_Windows_Portable_v${{ inputs.version || '1.0.0' }}.zip" -Force
        shell: powershell

      - name: 📥 Télécharger VC++ Redistributable pour l'installeur
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "windows\vc_redist.x64.exe"
        shell: powershell

      - name: ⚙️ Compiler l'installeur avec Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "windows\setup.iss"
        shell: pwsh

      - name: ⬆️ Upload Installeur Windows (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: NMaShop-Windows-Setup-v${{ inputs.version || '1.0.0' }}
          path: build/windows/NMaShop_Setup_*.exe
          retention-days: 30

      - name: ⬆️ Upload Version Portable (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: NMaShop-Windows-Portable-v${{ inputs.version || '1.0.0' }}
          path: build/windows/NMaShop_Windows_Portable_v*.zip
          retention-days: 30

  # ── 2. COMPILATION LINUX ───────────────────────────────────────────────────
  build-linux:
    name: 🐧 Build Linux (x64 Release .tar.gz)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 🛠️ Installer les dépendances Linux système
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev

      - name: 🐦 Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: 📦 Dépendances Flutter
        run: |
          flutter clean
          flutter pub get

      - name: 🔑 Générer .env et code obfusqué
        shell: bash
        run: |
          echo 'NEON_CONNECTION_STRING="${{ secrets.NEON_CONNECTION_STRING || 'postgresql://neondb_owner:npg_bY9MjSynWF4N@ep-long-scene-aeya27z7-pooler.c-2.us-east-2.aws.neon.tech/neondb?sslmode=require' }}"' > .env
          echo 'LICENSE_SECURITY_SALT="${{ secrets.LICENSE_SECURITY_SALT || 'NMaShop_security_salt_2026' }}"' >> .env
          echo 'LICENSE_SECRET_F1="${{ secrets.LICENSE_SECRET_F1 || 'Nm4' }}"' >> .env
          echo 'LICENSE_SECRET_F2="${{ secrets.LICENSE_SECRET_F2 || 'Sh0' }}"' >> .env
          echo 'LICENSE_SECRET_F3="${{ secrets.LICENSE_SECRET_F3 || 'pGN' }}"' >> .env
          echo 'LICENSE_SECRET_F4="${{ secrets.LICENSE_SECRET_F4 || '3e!' }}"' >> .env
          echo 'LICENSE_SECRET_F5="${{ secrets.LICENSE_SECRET_F5 || '2026' }}"' >> .env
          dart run build_runner build --delete-conflicting-outputs

      - name: 🧪 Exécuter les tests Desktop
        run: flutter test test/

      - name: 🔨 Compiler l'application (Linux Release Obfusqué)
        run: |
          mkdir -p build/symbols
          flutter build linux --release --obfuscate --split-debug-info=build/symbols --build-name=${{ inputs.version || '1.0.0' }}

      - name: 📦 Créer l'archive Tarball (.tar.gz)
        run: |
          tar -czvf NMaShop_Linux_v${{ inputs.version || '1.0.0' }}_x64.tar.gz -C build/linux/x64/release/bundle .

      - name: ⬆️ Upload Archive Linux (.tar.gz)
        uses: actions/upload-artifact@v4
        with:
          name: NMaShop-Linux-x64-v${{ inputs.version || '1.0.0' }}
          path: NMaShop_Linux_v*.tar.gz
          retention-days: 30

  # ── 3. PUBLICATION AUTOMATIQUE DE LA RELEASE GITHUB ────────────────────────
  publish-release:
    name: 🏷️ Publier la Release GitHub
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Créer le répertoire de distribution
        run: mkdir -p ./release-assets

      - name: 📥 Télécharger tous les artefacts compilés (Windows & Linux)
        uses: actions/download-artifact@v4
        with:
          pattern: NMaShop-*
          path: ./release-assets
          merge-multiple: true

      - name: 🚀 Créer la Release GitHub Officielle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.version || '1.0.0') }}
          name: N'MaShop Desktop v${{ inputs.version || '1.0.0' }} (Windows & Linux)
          body: |
            🎉 **Publication Officielle de Production — N'MaShop Desktop v${{ inputs.version || '1.0.0' }}**
            
            Logiciel de gestion commerciale, caisse POS et comptabilité 100% hors-ligne pour commerçants et grossistes.
            
            ### 📦 Fichiers téléchargeables :
            * 🪟 **Windows (Recommandé pour PC)** :
              * **Installeur automatique** : `NMaShop_Setup_v1.0.0.exe` (avec dépendances C++ et création d'icône bureau)
              * **Version portable** : `NMaShop_Windows_Portable_v1.0.0.zip` (décompresser et lancer directement)
            * 🐧 **Linux (Ubuntu / Debian x64)** :
              * **Archive binaire native** : `NMaShop_Linux_v1.0.0_x64.tar.gz`
            
            ### 🛡️ Sécurité & Spécifications :
            * Code compilé nativement AOT et obfusqué (Levier 1 Sécurité).
            * Chiffrement HMAC-SHA256, liaison matérielle PC (Hardware ID) et période d'essai 7 jours intégrée.
            * Intégrité SQLite Drift v21 (WAL, clés étrangères actives, cache 64 Mo).
            * Support officiel développeur : **+224 624 19 30 69**.
          files: |
            ./release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
