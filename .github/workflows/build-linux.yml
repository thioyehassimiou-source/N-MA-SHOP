name: 🐧 Build N'MaShop — Linux Bundle

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version de l'application (ex: 1.1.7)"
        required: false
        default: "1.1.7"
  push:
    branches:
      - main
    paths:
      - "lib/**"
      - "linux/**"
      - "pubspec.yaml"
      - ".github/workflows/build-linux.yml"

jobs:
  build-linux:
    name: 🐧 Compiler pour Linux (x64 Release)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 📌 Déterminer la version
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          fi
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="1.1.7"
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: 🛠️ Dépendances Linux (GTK3, CMake, Ninja, Clang)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev

      - name: 🐦 Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: 📦 Dépendances Flutter (pub get)
        run: |
          flutter clean
          flutter pub get

      - name: 🔑 Générer .env et code obfusqué
        shell: bash
        run: |
          cat << 'EOF' > .env
          NEON_CONNECTION_STRING=postgresql://neondb_owner:npg_bY9MjSynWF4N@ep-long-scene-aeya27z7-pooler.c-2.us-east-2.aws.neon.tech/neondb?sslmode=require
          LICENSE_SECURITY_SALT=NMaShop_security_salt_2026
          LICENSE_SECRET_F1=Nm4
          LICENSE_SECRET_F2=Sh0
          LICENSE_SECRET_F3=pGN
          LICENSE_SECRET_F4=3e!
          LICENSE_SECRET_F5=2026
          EOF
          NEON="${{ secrets.NEON_CONNECTION_STRING }}"
          if [ -n "$NEON" ]; then
            echo "NEON_CONNECTION_STRING=$NEON" > .env
          fi
          SALT="${{ secrets.LICENSE_SECURITY_SALT }}"
          if [ -n "$SALT" ]; then
            echo "LICENSE_SECURITY_SALT=$SALT" >> .env
          fi
          dart run build_runner build --delete-conflicting-outputs

      - name: 🧪 Exécuter les tests Desktop
        run: flutter test test/

      - name: 🔨 Compiler N'MaShop (Linux Release Obfusqué)
        run: |
          mkdir -p build/symbols
          flutter build linux --release --obfuscate --split-debug-info=build/symbols --build-name=${{ env.APP_VERSION }}

      - name: 📦 Créer l'archive Tarball (.tar.gz)
        run: |
          tar -czvf NMaShop_Linux_v${{ env.APP_VERSION }}_x64.tar.gz -C build/linux/x64/release/bundle .

      - name: ⬆️ Publier l'archive Linux (.tar.gz)
        uses: actions/upload-artifact@v4
        with:
          name: NMaShop-Linux-x64-v${{ env.APP_VERSION }}
          path: NMaShop_Linux_v*.tar.gz
          retention-days: 30
